# Veröffentlicht automatisch auf CurseForge, sobald sich die Version in der .toc ändert.
# Ablauf: Version aus "## Version:" lesen -> Tag v<Version> anlegen (falls neu) -> Paket bauen und hochladen.
# Benötigt das Secret CF_API_KEY und "## X-Curse-Project-ID" in der .toc.
name: Release

on:
  push:
    branches: [main]
    paths: [AddonDoktor.toc]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version lesen und Tag anlegen
        id: version
        run: |
          VERSION=$(grep -m1 '^## Version:' AddonDoktor.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          echo "Version: $VERSION"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION gibt es schon – nichts zu veröffentlichen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            git config user.name "Rottgar"
            git config user.email "Rottgar85@users.noreply.github.com"
            git tag "v$VERSION"
            git push origin "v$VERSION"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Packager direkt starten: die Action bricht bei Branch-Pushes mit frischem Tag ab ("future tag").
      # Ohne GITHUB_ACTIONS behandelt er den Lauf wie lokal und veröffentlicht den Tag auf HEAD.
      - name: Paket bauen und auf CurseForge hochladen
        if: steps.version.outputs.skip == 'false'
        run: |
          curl -fsSL https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh -o /tmp/release.sh
          env -u GITHUB_ACTIONS bash /tmp/release.sh
