# Baut bei jedem Versions-Tag (z. B. v0.9.2-beta) automatisch das Paket
# und lädt es auf CurseForge hoch. Benötigt das Secret CF_API_KEY im GitHub-Repository
# und die Zeile "## X-Curse-Project-ID: <ID>" in der .toc.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
